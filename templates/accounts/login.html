{% extends "base.html" %}

{% block title %}Login | BookNest{% endblock %}

{% block content %}

<section class="section">

    <div class="form-container">

        <h1>Welcome Back 👋</h1>

        <p class="section-subtitle">
            Login to continue shopping for your favourite books.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width: 100%;"
            >
                Login
            </button>

        </form>


        <p class="text-center mt-20">

            Don't have an account?

            <a
                href="/accounts/register/"
                style="color: var(--primary); font-weight: 700;"
            >
                Register
            </a>

        </p>

    </div>

</section>

{% endblock %}
