{% extends "base.html" %}

{% block title %}Register | BookNest{% endblock %}

{% block content %}

<section class="section">

    <div class="form-container">

        <h1>Create Your Account 📚</h1>

        <p class="section-subtitle">
            Join BookNest and start discovering great books.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="first_name">
                    First Name
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="Enter your first name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="last_name">
                    Last Name
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    placeholder="Enter your last name"
                >

            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password1">
                    Password
                </label>

                <input
                    type="password"
                    id="password1"
                    name="password1"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="password2"
                    name="password2"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width: 100%;"
            >
                Create Account
            </button>

        </form>


        <p class="text-center mt-20">

            Already have an account?

            <a
                href="/accounts/login/"
                style="color: var(--primary); font-weight: 700;"
            >
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
